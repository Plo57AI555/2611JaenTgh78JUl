(function(){
const T=TRIP,M=T.meta,P=M.slug+':',$=s=>document.querySelector(s);
const ls={g(k){try{return localStorage.getItem(P+k)}catch(e){return null}},s(k,v){try{localStorage.setItem(P+k,v)}catch(e){}}};
const q=new URLSearchParams(location.search);
function now(){if(q.get('d'))return{d:q.get('d'),t:q.get('t')||'12:00'};const s=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()).split(' ');return{d:s[0],t:s[1]}}
const diff=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const fd=d=>new Date(d+'T12:00:00Z').toLocaleDateString('es-ES',{timeZone:'UTC',weekday:'short',day:'numeric',month:'short'});
const maps=p=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.q);
const dir=(a,b)=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(T.places[a].q)+'&destination='+encodeURIComponent(T.places[b].q);
const lnk=p=>'<a class="btn" href="'+maps(p)+'" target="_blank" rel="noopener">Mapa</a>'+(p.tel?'<a class="btn" href="tel:'+p.tel+'">Llamar</a>':'')+(p.url?'<a class="btn" href="'+p.url+'" target="_blank" rel="noopener">Horarios</a>':'');
const rest=id=>T.food.rest.find(r=>r.id===id);
const tq=ks=>'<div class="row">'+ks.map(k=>'<a class="btn" href="'+T.tiempo[k].horas+'" target="_blank" rel="noopener">Tiempo '+T.tiempo[k].n+'</a>').join('')+'</div>';
const done=id=>ls.g('t:'+id)==='1';
const km=T.days.reduce((s,d)=>s+d.items.reduce((a,i)=>a+(i.km||0),0),0);
const act=d=>T.alerts.filter(a=>a.until>=d);
const al=a=>'<div class="alert '+a.lvl+'"><b>'+({info:'Info',atencion:'Atención',critico:'Crítico'})[a.lvl]+':</b> '+a.msg+'<small>Fuente: '+a.src+' · verificado '+a.verified+'</small></div>';
const sunH=s=>'☀ Puesta <b>'+s.set+'</b> · Hora azul <b>'+s.blue[0]+'-'+s.blue[1]+'</b> · Amanecer '+s.rise+' ('+s.lugar+')';
const toggles=el=>el.querySelectorAll('input[data-id]').forEach(i=>i.onchange=()=>{ls.s('t:'+i.dataset.id,i.checked?'1':'0');render()});
function inicio(){const n=now(),c=diff(n.d,M.start),el=$('#inicio');
const open=T.todos.filter(t=>!done(t.id)).sort((a,b)=>a.due<b.due?-1:1);
let h='<h1>'+M.title+'</h1><p class="mu">'+M.sub+'</p>';
const okb=T.bookings.filter(b=>b.st==='ok').length;
const stats='<div class="stats"><span>'+T.days.length+' días</span><span>'+km+' km</span><span>'+okb+'/'+T.bookings.length+' reservas</span><span>'+open.length+' pendientes</span></div>';
const day=T.days.find(d=>d.date===n.d);
if(c>0){h+='<div class="hero"><b>'+c+'</b>días para el viaje'+stats+'</div><div class="card"><h3>Tiempo (AEMET)</h3><p class="mu">Consulta la previsión unos días antes de salir.</p>'+tq(Object.keys(T.tiempo))+'</div>'+act(n.d).filter(a=>a.lvl!=='info').map(al).join('')+'<h2>Pendientes por fecha límite</h2>'+(open.length?open.map(t=>{const r=diff(n.d,t.due);return '<label class="todo"><input type="checkbox" data-id="'+t.id+'"><span>'+t.t+'<br><span class="chip '+(r<0?'c-bad':r<=3?'c-warn':'')+'">antes del '+fd(t.due)+(r<0?' · vencido':'')+'</span></span></label>'}).join(''):'<p class="mu">Todo hecho.</p>')}
else if(day){const nx=day.items.find(i=>{const m=/(\d\d:\d\d)/.exec(i.t);return m&&m[1]>=n.t});const ce=day.items.find(i=>i.meal==='cena');
h+='<div class="hero"><b>'+day.title+'</b>'+day.note+stats+'</div><div class="card"><p class="mu">'+sunH(T.sun[day.id])+'</p></div>';
h+='<div class="card"><h3>Siguiente paso</h3>'+(nx?'<p><span class="t">'+nx.t+'</span> <b>'+nx.what+'</b></p>'+(nx.note?'<p class="mu">'+nx.note+'</p>':'')+(nx.place?'<div class="row">'+lnk(T.places[nx.place])+'</div>':''):'<p>Día completado.</p>')+'</div>';
if(ce)h+='<div class="card"><h3>Esta noche</h3><p><b>'+ce.what+'</b> · Reserva: '+ce.res+'</p></div>';
h+='<div class="card" id="wx"><h3>Tiempo</h3><p class="mu">Cargando…</p></div><div class="card"><h3>Tiempo por horas (AEMET)</h3>'+tq(day.tiempo)+'</div>'+act(n.d).filter(a=>a.day===day.id).map(al).join('')}
else h+='<div class="hero"><b>Fin</b>Viaje terminado: convierte esta web en diario y retira los datos personales.'+stats+'</div>';
el.innerHTML=h;toggles(el);if(day&&c<=0)wx(day)}
async function wx(day){const box=$('#wx');if(!box)return;let o=null;
try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+M.lat+'&longitude='+M.lng+'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FMadrid&forecast_days=7');o=await r.json();o.ts=new Date().toISOString();ls.s('wx',JSON.stringify(o))}catch(e){try{o=JSON.parse(ls.g('wx'))}catch(x){}}
if(!o||!o.daily){box.innerHTML='<h3>Tiempo</h3><p class="mu">Sin datos (sin red y sin lectura guardada).</p>';return}
const i=o.daily.time.indexOf(day.date);box.innerHTML='<h3>Tiempo</h3>'+(i<0?'<p class="mu">Sin previsión para hoy en la última lectura.</p>':'<p><b>'+Math.round(o.daily.temperature_2m_min[i])+'° / '+Math.round(o.daily.temperature_2m_max[i])+'°</b> · lluvia '+o.daily.precipitation_probability_max[i]+' %</p>')+'<p class="mu">Última lectura: '+new Date(o.ts).toLocaleString('es-ES',{timeZone:'Europe/Madrid'})+' (Open-Meteo)</p>'}
function dias(){const n=now();let h='<h1>Días</h1><div class="chips daynav">'+T.days.map(d=>'<a class="btn" href="#d-'+d.id+'">'+d.title+'</a>').join('')+'</div>';
T.days.forEach(d=>{h+='<h2 id="d-'+d.id+'">'+d.title+'</h2><p class="mu">'+d.note+'</p><div class="card"><p class="mu">'+sunH(T.sun[d.id])+'</p><p class="mu">📷 '+d.lens+'</p>'+tq(d.tiempo)+'</div>'+act(n.d).filter(a=>a.day===d.id).map(al).join('');
h+='<ol class="tl">'+d.items.map(i=>{let x='<li class="'+(i.star?'star':'')+'"><span class="t">'+i.t+'</span> <span class="what">'+(i.star?'⭐ ':'')+i.what+'</span>'+(i.opt?' <span class="opt">(opcional)</span>':'')+(i.km?' <span class="chip">'+i.km+' km</span>':'');
if(i.note)x+='<p class="mu">'+i.note+'</p>';
if(i.meal&&i.opts)x+='<p class="mu">'+i.opts.map(id=>{const r=rest(id);return r.n}).join(' · ')+'</p>'+(i.res?'<p><span class="chip c-warn">Reserva: '+i.res+'</span></p>':'');
if(i.todo){const dn=done(i.todo);x+='<p><span class="chip '+(dn?'c-ok':'c-warn')+'">'+(dn?'✓ hecho':'pendiente')+'</span></p>'}
if(i.place)x+='<div class="row">'+lnk(T.places[i.place])+'</div>';
[i.learn,i.learn2].filter(Boolean).forEach(k=>{const L=T.learn[k];x+='<details class="learn"><summary>Saber más · '+L.t+'</summary><div class="lb"><p>'+L.sum+'</p><ul>'+L.cur.map(c=>'<li>'+c+'</li>').join('')+'</ul><small>Fuente: <a href="'+L.url+'" target="_blank" rel="noopener">'+L.src+'</a> · verificado '+L.ver+'</small></div></details>'});
return x+'</li>'}).join('')+'</ol>';
h+='<div class="card"><b>Plan B:</b> '+d.planB+'</div>'});
$('#dias').innerHTML=h}
let flt='todos';
function comer(){const F=T.food,ds=['todos','jaen','baeza','ubeda'];
let h='<h1>Comer</h1><h2>Platos típicos</h2><p class="mu">Lo más habitual de la zona. Verificado '+F.ver+'.</p>'+F.tipicos.map(p=>'<div class="card"><b>'+p.n+'</b><p>'+p.d+'</p><small class="mu">Fuente: <a href="'+p.url+'" target="_blank" rel="noopener">'+p.src+'</a></small></div>').join('');
h+='<h2>Restaurantes</h2><p class="mu">Horarios y menús sin verificar: llama antes de ir.</p><div class="chips">'+ds.map(d=>'<button class="btn" aria-pressed="'+(flt===d)+'" data-f="'+d+'">'+d[0].toUpperCase()+d.slice(1)+'</button>').join('')+'</div>';
h+=F.rest.filter(r=>flt==='todos'||r.d===flt).map(r=>'<div class="card"><b>'+r.n+'</b> <span class="chip">'+r.d[0].toUpperCase()+r.d.slice(1)+'</span><div class="row"><a class="btn" href="'+maps(r)+'" target="_blank" rel="noopener">Mapa</a></div></div>').join('');
const el=$('#comer');el.innerHTML=h;el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;comer()})}
function reservas(){let h='<h1>Reservas</h1>'+T.bookings.map(b=>'<div class="card"><b>'+b.n+'</b> <span class="chip '+(b.st==='ok'?'c-ok':'c-warn')+'">'+(b.st==='ok'?'Reservado':'Ver correo/Wallet')+'</span><p class="mu">'+b.tipo+' · '+b.when+'</p><p>'+b.dir+'</p>'+(b.check?'<p class="mu">'+b.check+'</p>':'')+'<p class="mu">Cancelación: '+b.cancel+'</p><div class="row">'+lnk(T.places[b.place])+'</div></div>').join('');
if(T.modules.coche)h+='<h2>Coche</h2><div class="card"><b>'+T.coche.n+'</b><p>'+T.coche.txt+'</p><div class="row">'+lnk(T.places[T.coche.place])+'</div></div>';
h+='<p class="mu">Localizadores y datos personales: en tu correo o Wallet (esta web es pública).</p>';$('#reservas').innerHTML=h}
function info(){let h='<h1>Info</h1><h2>Pendientes y checklist</h2>'+T.todos.slice().sort((a,b)=>a.due<b.due?-1:1).map(t=>'<label class="todo"><input type="checkbox" data-id="'+t.id+'" '+(done(t.id)?'checked':'')+'><span>'+t.t+'<br><span class="chip">antes del '+fd(t.due)+'</span></span></label>').join('');
h+='<h2>Fotos y rutas</h2><div class="scroll"><table><tr><th>Día</th><th>Puesta</th><th>Hora azul</th></tr>'+T.days.map(d=>{const s=T.sun[d.id];return '<tr><td>'+d.title+' ('+s.lugar+')</td><td>'+s.set+'</td><td>'+s.blue[0]+'-'+s.blue[1]+'</td></tr>'}).join('')+'</table></div><p class="mu">'+T.sun.src+'</p>';
h+='<div class="row"><a class="btn" href="'+dir('parador','oleicola')+'" target="_blank" rel="noopener">Parador → almazara</a><a class="btn" href="'+dir('oleicola','baeza')+'" target="_blank" rel="noopener">Almazara → Baeza</a><a class="btn" href="'+dir('baeza','ubeda')+'" target="_blank" rel="noopener">Baeza → Úbeda</a><a class="btn" href="'+dir('ubeda','parador')+'" target="_blank" rel="noopener">Úbeda → Parador</a></div>';
h+='<h2>Utilidades</h2><h3>Tiempo (AEMET)</h3>'+Object.keys(T.tiempo).map(k=>{const c=T.tiempo[k];return '<p><b>'+c.n+'</b> · <a href="'+c.url+'" target="_blank" rel="noopener">previsión</a> · <a href="'+c.horas+'" target="_blank" rel="noopener">por horas</a></p>'}).join('')+'<h3>Enlaces</h3>'+T.links.map(l=>'<p><a href="'+l.u+'" target="_blank" rel="noopener">'+l.n+'</a></p>').join('')+'<h3>SOS (funciona sin red)</h3><div class="row">'+T.sos.map(s=>'<a class="btn fill" href="tel:'+s.tel+'">'+s.n+' '+s.tel+'</a>').join('')+'</div>';
const el=$('#info');el.innerHTML=h;toggles(el)}
function foot(){$('#foot').innerHTML='<p>'+M.title+' · v'+M.ver+' · '+M.built+'</p><p>'+M.log+'</p><div class="row"><button class="btn" id="upd">Actualizar</button></div>';$('#upd').onclick=async()=>{try{const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()));const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}catch(e){}location.reload()}}
function render(){inicio();dias();comer();reservas();info()}
function show(){const t=(location.hash||'#inicio').slice(1);const id=['inicio','dias','comer','reservas','info'].includes(t)?t:(t.startsWith('d-')?'dias':'inicio');document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id===id));document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===id));if(t.startsWith('d-')){const e=document.getElementById(t);if(e)e.scrollIntoView()}else window.scrollTo(0,0)}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{location.hash='#'+b.dataset.t});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.learn')&&e.target.open)document.querySelectorAll('details.learn[open]').forEach(d=>{if(d!==e.target)d.open=false})},true);
addEventListener('hashchange',show);render();foot();show();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
