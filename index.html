const todoOf=i=>i.todo&&T.todos.find(t=>t.id===i.todo);
function estOf(i){if(i.est&&EST[i.est])return EST[i.est];if(!(i.meal||i.res))return null;const td=todoOf(i);return td&&td.hecho?EST.reservado:EST.pendiente}
const VEH={tesla:{n:'Tesla Model 3 Standard (eléctrico)',carga:'imprescindible'},bmw:{n:'BMW X3 (híbrido enchufable)',carga:'opcional'},otro:{n:'Otro vehículo o alquiler',carga:'por confirmar'}};
const veh=()=>MOD.coche&&T.coche&&VEH[T.coche.vehiculo];
function cargaChip(b){const v=veh();if(!v||b.tipo!=='Hotel')return '';const c=b.cargador;if(c==='si')return ' <span class="chip c-ok">⚡ Cargador: sí</span>';if(c==='no')return ' <span class="chip '+(T.coche.vehiculo==='tesla'?'c-bad':'')+'">⚡ Sin cargador</span>';return ' <span class="chip '+(T.coche.vehiculo==='tesla'?'c-warn':'')+'">⚡ Cargador: por confirmar'+(T.coche.vehiculo==='bmw'?' (opcional)':'')+'</span>'}
function hotelOn(d){return T.bookings.find(b=>b.tipo==='Hotel'&&b.in&&b.in<=d&&d<b.out)}
/* ── Inicio ── */
function hd(){return '<div class="hd"><div><h1>'+M.title+'</h1><p class="mu">'+sub()+'</p></div><button class="ibtn" id="thm" aria-label="Cambiar entre tema claro y oscuro">'+(eff()==='dark'?'☀️':'🌙')+'</button></div>'}
/* AJUSTE JAÉN: tarjeta de día (fecha, lugares, iconos de las paradas, km y nota), todo derivado de TRIP */
function dayCard(d,today){const dt=new Date(d.date+'T12:00:00Z'),wd=dt.toLocaleDateString('es-ES',{timeZone:'UTC',weekday:'short'}).replace('.',''),ic=[...new Set(d.items.map(ico))].slice(0,8).join(' '),kd=d.items.reduce((a,i)=>a+(i.km||0),0),tt=d.title.split(' - ').slice(1).join(' - ')||d.title,hoy=d.date===today;return '<a class="dcard'+(hoy?' hoy':'')+'" href="#d-'+d.id+'"'+(hoy?' aria-current="date"':'')+'><div class="dn"><small>'+wd+'</small><b>'+dt.getUTCDate()+'</b></div><div><h4>'+tt+'</h4><p class="ic">'+ic+'</p><p class="mu">'+(kd?kd+' km · ':'')+d.note+'</p></div></a>'}
function inicio(){const n=now(),c=diff(n.d,M.start),el=$('#inicio'),op=openT();
const okb=T.bookings.filter(b=>b.st==='ok').length;
const stats='<div class="stats"><span>'+T.days.length+' días</span>'+(km?'<span>'+km+' km</span>':'')+'<span>'+okb+'/'+T.bookings.length+' reservas</span><span>'+op.length+' pendientes</span></div>';
const day=T.days.find(d=>d.date===n.d),ended=n.d>M.end;
let h=hd();
if(c>0)h+='<div class="hero" data-g="'+G('🧳')+'"><b>'+c+'</b>días para el viaje'+stats+'</div>';
else if(ended)h+='<div class="hero" data-g="'+G('🎉')+'"><b>Fin</b>Viaje terminado: convierte esta web en diario y retira los datos personales.'+stats+'</div>';
else{const k=T.days.findIndex(d=>d.date===n.d)+1;h+='<div class="hero" data-g="'+G('☀️')+'"><b>'+(k?'Día '+k+' de '+T.days.length:'En viaje')+'</b>'+(day?day.title:'')+stats+'</div>'}
if(day&&c<=0&&!ended){const nx=day.items.find(i=>{const m=/(\d\d:\d\d)/.exec(itemT(day,i));return m&&m[1]>=n.t}),ce=day.items.find(i=>i.meal==='cena'),ho=hotelOn(n.d),k0=(day.tiempo||[])[0];
h+='<div class="card k-next"><h3>⏭️ Ahora</h3>'+(nx?'<p><span class="t">'+itemT(day,nx)+'</span> <b>'+nx.what+'</b></p>'+(nx.note?'<p class="mu">'+tk(nx.note,day.date,nx.blue||day.base)+'</p>':''):'<p>Día completado.</p>')+(ce?'<p class="mu">🌙 '+ce.what+(estOf(ce)?' · '+estOf(ce)[0]:'')+'</p>':'')+(ho?'<p class="mu">🏨 '+ho.n+'</p>':'')+(k0?'<p class="mu" data-wxnow="'+k0+'|'+day.date+'">Cargando tiempo…</p>':'')+'</div>'}
h+='<h2>🧭 Itinerario</h2>'+T.days.map(d=>dayCard(d,n.d)).join('');
const tk0=Object.keys(T.tiempo);if(tk0.length){const ref=(c>0?M.start:day?day.date:M.start);h+='<div class="card"><h3>Tiempo</h3>'+tq(tk0,ref)+'</div>'}
const al0=act(n.d).filter(a=>a.lvl!=='info');if(al0.length)h+='<h2>Atención</h2>'+al0.map(al).join('');
h+='<h2>Pendientes</h2>'+(op.length?op.map(t=>pend(t,diff(n.d,t.due))).join(''):'<p class="mu">Nada pendiente.</p>');
el.innerHTML=h;wireTheme();wxLoad()}
/* ── Días ── */
function itemT(d,i){if(i.t)return i.t;const u=i.blue&&sun(d.date,i.blue);return u?u.b1:'—'}
const dayActs=d=>MOD.actividades===false?[]:T.actividades.filter(a=>[].concat(a.dia||[]).includes(d.id));
function dias(){const n=now();let h='<h1>Días</h1><div class="chips daynav">'+T.days.map(d=>'<a class="btn" href="#d-'+d.id+'"'+(d.date===n.d?' aria-current="date"':'')+'>'+dshort(d)+'</a>').join('')+'</div>';
T.days.forEach(d=>{const u=sun(d.date,d.base),ac=dayActs(d);h+='<h2 id="d-'+d.id+'">'+d.title+'</h2><p class="mu">'+d.note+'</p>'+sunB(u);
if(ac.length)h+='<details class="learn ideas"><summary>🎈 Ideas del día · '+ac.length+'</summary><div class="lb">'+ac.map(a=>'<div class="idea"><b>'+a.n+'</b> <span class="chip '+(a.estado==='elegida'?'c-ok':'')+'">'+(a.estado==='elegida'?'elegida':'sugerencia')+'</span><p>'+a.why+'</p><p class="mu">Coste: '+a.coste+' · Tiempo: '+a.tiempo+' · Reserva: '+a.reserva+' · Dificultad: '+a.dificultad+'</p><small>Fuente: <a href="'+a.url+'" target="_blank" rel="noopener">'+a.src+'</a> · verificado '+a.ver+'</small></div>').join('')+'</div></details>';
h+='<div class="card"><p class="mu">📷 '+d.lens+'</p>'+(d.photo?'<p class="mu">'+d.photo+'</p>':'')+(d.tiempo&&d.tiempo.length?tq(d.tiempo,d.date):'')+'</div>'+act(n.d).filter(a=>a.day===d.id).map(al).join('');
h+='<ol class="tl">'+d.items.map(i=>{const sid=i.blue||d.base;let x='<li class="'+(i.star?'star':'')+'" data-i="'+ico(i)+'"><div class="it"><span class="t">'+itemT(d,i)+'</span> <span class="what">'+(i.star?'⭐ ':'')+i.what+'</span>'+(i.opt?' <span class="opt">(opcional)</span>':'')+(i.km?' <span class="chip">'+i.km+' km</span>':'')+(i.dur?' <span class="chip">'+i.dur+' min</span>':'');
if(i.note)x+='<p class="mu">'+tk(i.note,d.date,sid)+'</p>';
if(i.blue){const b=sun(d.date,i.blue);if(b)x+='<p class="mu">'+sunH(b)+'</p>'}
if(i.meal&&i.opts&&i.opts.length)x+='<p class="mu">'+i.opts.map(id=>{const r=rest(id);return r?r.n+rk(r):id}).join(' · ')+'</p>';
if(i.mapa&&i.place)x+=lnk(PL(i.place));
[i.learn,i.learn2].filter(Boolean).forEach(k=>{const L=T.learn[k];x+='<details class="learn"><summary>Saber más · '+L.t+'</summary><div class="lb"><p>'+L.sum+'</p><ul>'+L.cur.map(c=>'<li>'+c+'</li>').join('')+'</ul><small>Fuente: <a href="'+L.url+'" target="_blank" rel="noopener">'+L.src+'</a> · verificado '+L.ver+'</small></div></details>'});
const es=estOf(i);if(es)x+='<p class="est"><span class="chip '+es[1]+'">'+es[0]+'</span></p>';
return x+'</div></li>'}).join('')+'</ol>';
if(d.last)h+='<div class="card"><b>'+d.last.x+':</b> '+(d.last.t?d.last.t+' <span class="mu">(verificado '+d.last.v+')</span>':'<span class="chip c-warn">por verificar</span>')+'</div>';
h+='<div class="card"><b>Plan B:</b> '+d.planB+'</div>'});
$('#dias').innerHTML=h}
/* ── Comer ── */
let flt='todos';
function comer(){const F=T.food||{},D=T.diet,cs=['todos'].concat([...new Set((F.rest||[]).map(r=>r.d))]);let h='<h1>Comer</h1>';
if(MOD.dieta&&D){h+='<h2>Enséñasela al camarero</h2><div class="wait" lang="'+D.lang+'">'+D.tarjeta.loc+'<small>'+D.tarjeta.es+'</small></div><h3>Frases</h3>'+D.frases.map(f=>'<div class="card"><b lang="'+D.lang+'">'+f.loc+'</b><p class="mu">'+f.es+'</p></div>').join('')+'<h3>Evitar</h3><ul class="l">'+D.evitar.map(x=>'<li>'+x+'</li>').join('')+'</ul><h3>Seguro</h3><ul class="l">'+D.seguro.map(x=>'<li>'+x+'</li>').join('')+'</ul><p class="mu">Alergia al trigo; la contaminación cruzada no es problema. '+(D.nota||'')+'</p>'}
h+='<h2>Platos típicos</h2><p class="mu">Lo más habitual de la zona. Verificado '+F.ver+'.</p>'+(F.tipicos||[]).map(p=>'<div class="card"><b>'+p.n+'</b>'+(MOD.dieta&&p.dieta?' <span class="chip '+RK[p.dieta]+'">'+p.dieta[0].toUpperCase()+p.dieta.slice(1)+'</span>':'')+'<p>'+p.d+'</p><small class="mu">Fuente: <a href="'+p.url+'" target="_blank" rel="noopener">'+p.src+'</a></small></div>').join('');
h+='<h2>Restaurantes</h2><p class="mu">'+(MOD.dieta?'Etiqueta y fecha de verificación en cada ficha; lo no verificado, confírmalo con el local.':'Horarios y menús sin verificar: confírmalos antes de ir.')+'</p><div class="chips">'+cs.map(d=>'<button class="btn" aria-pressed="'+(flt===d)+'" data-f="'+d+'">'+d[0].toUpperCase()+d.slice(1)+'</button>').join('')+'</div>';
h+=(F.rest||[]).filter(r=>flt==='todos'||r.d===flt).map(r=>'<div class="card"><b>'+r.n+'</b> <span class="chip">'+r.d+'</span>'+rk(r)+'<p>'+(r.desc||r.note||'')+'</p>'+(MOD.dieta?'<p class="mu">Verificado: '+(r.v||'pendiente')+'</p>':'')+'</div>').join('');
if(MOD.supermercado&&D&&D.super)h+='<h2>Supermercado</h2><div class="card"><p>'+D.super+'</p></div>';
const el=$('#comer');el.innerHTML=h;el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;comer()})}
/* ── Reservas (único sitio con mapa, llamar y horarios) ── */
function reservas(){let h='<h1>Reservas</h1>'+T.bookings.map(b=>{const s=ST[b.st],p=b.place&&PL(b.place);return '<div class="card"><b>'+b.n+'</b> <span class="chip '+s[1]+'">'+s[0]+'</span>'+cargaChip(b)+'<p class="mu">'+b.tipo+' · '+b.when+'</p>'+(b.dir?'<p>'+b.dir+'</p>':'')+(b.check?'<p class="mu">'+b.check+'</p>':'')+'<p class="mu">Cancelación: '+b.cancel+'</p>'+(p?lnk(p):'')+'</div>'}).join('');
const v=veh();if(v)h+='<h2>Coche</h2><div class="card"><b>'+v.n+'</b> <span class="chip '+(T.coche.vehiculo==='tesla'?'c-warn':'')+'">⚡ Carga: '+v.carga+'</span><p>'+T.coche.txt+'</p>'+(T.coche.place&&PL(T.coche.place)?lnk(PL(T.coche.place)):'')+'</div>';
else if(MOD.coche&&T.coche)h+='<h2>Coche</h2><div class="card"><b>'+T.coche.n+'</b><p>'+T.coche.txt+'</p>'+(T.coche.place&&PL(T.coche.place)?lnk(PL(T.coche.place)):'')+'</div>';
h+='<p class="mu">Localizadores y datos personales: en tu correo o Wallet (esta web es pública).</p>';$('#reservas').innerHTML=h}
/* ── Info ── */
function audit(){const o=[],D=T.days,wk=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],lead=/(hora azul|puesta)[^.]{0,24}\d\d:\d\d/i;
if(D[0].date!==M.start)o.push('El primer día no coincide con el inicio del viaje');
if(D[D.length-1].date!==M.end)o.push('El último día no coincide con el fin del viaje');
if(!(M.lugares&&M.lugares.length))o.push('Falta meta.lugares (subtítulo de Inicio)');
D.forEach(d=>{if(d.date<M.start||d.date>M.end)o.push(d.title+': fecha fuera del viaje');
const w=d.title.toLowerCase().split(/[\s]/)[0],wi=new Date(d.date+'T12:00:00Z').getUTCDay();if(wk.includes(w)&&wk[wi]!==w)o.push(d.title+': no es '+w+' el '+d.date);
if(d.title.indexOf(' - ')<0)o.push(d.title+': el título debe ser «Día n - lugares o actividades»');
if(!PL(d.base)||PL(d.base).lat==null)o.push(d.title+': falta lugar base con lat/lng (hora azul)');
d.items.forEach(i=>{['place','blue'].forEach(k=>{if(i[k]&&!PL(i[k]))o.push(d.title+': lugar inexistente «'+i[k]+'»')});
[i.learn,i.learn2].filter(Boolean).forEach(k=>{const L=T.learn[k];if(!L)o.push(d.title+': Saber más inexistente «'+k+'»');else if(!L.src||!L.url||!L.ver)o.push('Saber más «'+k+'» sin fuente o fecha')});
(i.opts||[]).forEach(id=>{if(!rest(id))o.push(d.title+': restaurante inexistente «'+id+'»')});
if(i.est&&!EST[i.est])o.push(d.title+': estado de comida no válido «'+i.est+'»');
if(i.todo&&!T.todos.find(t=>t.id===i.todo))o.push(d.title+': pendiente inexistente «'+i.todo+'»');
if(i.act&&!T.actividades.find(a=>a.id===i.act))o.push(d.title+': actividad inexistente «'+i.act+'»');
const tx=(i.what||'')+' '+(i.note||'');if(lead.test(tx))o.push(d.title+': hora azul/puesta escrita a mano en «'+i.what+'»');
if(/\{(rise|set|b1|b2)\}/.test(tx)&&!sun(d.date,i.blue||d.base))o.push(d.title+': hora azul sin coordenadas en «'+i.what+'»')});
if(d.last&&!d.last.t)o.push(d.title+': último transporte sin verificar');
if(d.last&&d.last.t){const u=sun(d.date,d.base);if(u&&u.b2>d.last.t)o.push(d.title+': el último transporte ('+d.last.t+') sale antes del fin de la hora azul ('+u.b2+'): revisa')}});
T.todos.forEach(t=>{if(!t.due)o.push('Pendiente sin fecha límite: '+t.id);if(!t.day&&!t.hecho&&t.due>=M.start&&!D.some(d=>d.items.some(i=>i.todo===t.id)))o.push('Pendiente sin día que no está en el horario: '+t.id);if(t.day&&!t.hecho){const d=D.find(x=>x.id===t.day);if(!d||!d.items.some(i=>i.todo===t.id))o.push('Pendiente que no está en el horario: '+t.id)}});
T.alerts.forEach(a=>{if(lead.test(a.msg))o.push('Aviso con hora azul/puesta escrita a mano: '+a.msg.slice(0,40)+'…');if(!a.until)o.push('Aviso sin fecha de fin: '+a.msg.slice(0,40)+'…');if(!a.verified)o.push('Aviso sin verificar: '+a.msg.slice(0,48)+'…')});
if(MOD.coche&&T.coche&&!VEH[T.coche.vehiculo])o.push('Coche: falta coche.vehiculo (tesla, bmw u otro)');
T.bookings.filter(b=>b.tipo==='Hotel'&&b.in).forEach(b=>{if(b.st!=='ok'&&b.st!=='ver')o.push('Hotel sin confirmar: '+b.n);if(/no verificado|por verificar/i.test(b.check||''))o.push('Check-in/out sin verificar: '+b.n);
if(MOD.coche&&T.coche&&T.coche.vehiculo==='tesla'&&b.cargador!=='si')o.push('Tesla: hotel sin cargador confirmado: '+b.n);
const di=D.find(d=>d.date===b.in),dout=D.find(d=>d.date===b.out);if(!di||!di.items.some(i=>i.in))o.push('Falta el check-in en el horario: '+b.n);if(!dout||!dout.items.some(i=>i.out))o.push('Falta el check-out en el horario: '+b.n)});
((T.food||{}).rest||[]).forEach(r=>{if(!r.desc)o.push('Restaurante sin descripción (comida y ambiente): '+r.n);if(MOD.dieta&&!r.v)o.push('Restaurante sin verificar: '+r.n)});
T.actividades.forEach(a=>{if(!a.dia)o.push('Actividad sin día asignado: '+a.n);else if(a.estado==='elegida'&&!D.some(d=>d.items.some(i=>i.act===a.id)))o.push('Actividad elegida que no está en el horario: '+a.n)});
return o}
const cid=(g,x,i)=>typeof x==='object'?x.id:'h'+hs(x);
const ctx=x=>typeof x==='object'?x.t:x;
const cdone=(g,x,i)=>ls.g('c:'+cid(g,x,i))==='1'||(typeof x!=='object'&&ls.g('t:k'+g+i)==='1');
function info(){let h='<h1>Info</h1><h2>Pendientes</h2><p class="mu">Se cierran en el chat del viaje, no aquí.</p>'+(openT().length?openT().map(t=>pend(t,diff(now().d,t.due))).join(''):'<p class="mu">Nada pendiente.</p>');
h+='<h2>Checklist</h2><p class="mu">Se guarda en este dispositivo y se conserva al actualizar la web.</p>';
Object.entries(T.check||{}).forEach(([g,a])=>{h+='<h3>'+g+'</h3>'+a.map((x,i)=>'<label class="todo"><input type="checkbox" data-c="'+cid(g,x,i)+'" '+(cdone(g,x,i)?'checked':'')+'><span>'+ctx(x)+'</span></label>').join('')});
h+='<h2>Fotos</h2><div class="scroll"><table><tr><th>Día</th><th>Puesta</th><th>Hora azul</th></tr>'+T.days.map(d=>{const s=sun(d.date,d.base);return '<tr><td>'+dshort(d)+'</td><td>'+(s?s.set:'—')+'</td><td>'+(s?s.b1+'–'+s.b2:'—')+'</td></tr>'}).join('')+'</table></div><p class="mu">Calculado en el móvil por coordenadas y fecha (hora local de '+TZ+'): puesta a −0,833°, hora azul entre −4° y −8°.</p>';
h+='<h2>Utilidades</h2>'+(Object.keys(T.tiempo).length?'<h3>Tiempo (servicio oficial)</h3>'+Object.keys(T.tiempo).map(k=>{const c=T.tiempo[k];return '<p><b>'+c.n+'</b> · <a href="'+c.url+'" target="_blank" rel="noopener">previsión</a>'+(c.horas?' · <a href="'+c.horas+'" target="_blank" rel="noopener">por horas</a>':'')+'</p>'}).join(''):'')+'<h3>Enlaces</h3>'+T.links.map(l=>'<p><a href="'+l.u+'" target="_blank" rel="noopener">'+l.n+'</a></p>').join('')+'<h3>SOS (funciona sin red)</h3><div class="row">'+T.sos.map(s=>'<a class="btn fill" href="tel:'+s.tel+'">'+s.n+' '+s.tel+'</a>').join('')+'</div>';
const au=audit();h+='<h3>Comprobaciones automáticas</h3>'+(au.length?'<ul class="l">'+au.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p class="mu">Sin incidencias.</p>');
const el=$('#info');el.innerHTML=h;el.querySelectorAll('input[data-c]').forEach(i=>i.onchange=()=>ls.s('c:'+i.dataset.c,i.checked?'1':'0'))}
/* ── Pie, tema, arranque ── */
const R=document.documentElement,eff=()=>R.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
{const t=ls.g('theme');if(t)R.dataset.theme=t}
function wireTheme(){const b=$('#thm');if(b)b.onclick=()=>{const n=eff()==='dark'?'light':'dark';R.dataset.theme=n;ls.s('theme',n);b.textContent=n==='dark'?'☀️':'🌙'}}
function foot(){$('#foot').innerHTML='<p>'+M.title+' · v'+M.ver+' · '+M.built+' · motor '+TPL+'</p>'}
function render(){inicio();dias();comer();reservas();info();wxPaint()}
function show(){const t=(location.hash||'#inicio').slice(1);const id=['inicio','dias','comer','reservas','info'].includes(t)?t:(t.startsWith('d-')?'dias':'inicio');$$('.sec').forEach(s=>s.classList.toggle('on',s.id===id));$$('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===id));
if(t.startsWith('d-')){const e=document.getElementById(t);if(e)e.scrollIntoView()}
else if(id==='dias'){const n=now(),cur=T.days.find(d=>d.date===n.d),e=cur&&document.getElementById('d-'+cur.id);if(e)e.scrollIntoView();else window.scrollTo(0,0)}
else window.scrollTo(0,0)}
$$('nav.tabs button').forEach(b=>b.onclick=()=>{if(location.hash==='#'+b.dataset.t)show();else location.hash='#'+b.dataset.t});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.learn')&&e.target.open)$$('details.learn[open]').forEach(d=>{if(d!==e.target&&d.parentNode===e.target.parentNode)d.open=false})},true);
addEventListener('hashchange',show);render();foot();show();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v='+encodeURIComponent(M.ver)+'&s='+encodeURIComponent(M.slug)).catch(()=>{}));
})();
</script>
